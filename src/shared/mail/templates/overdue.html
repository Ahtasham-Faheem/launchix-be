<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: 'Inter', sans-serif; background: #fff8f8; color: #1e293b; padding: 40px; }
    .card { background: white; border-left: 6px solid #ef4444; border-radius: 12px; padding: 32px; max-width: 600px; margin: auto; box-shadow: 0 2px 12px rgba(239,68,68,0.2); }
    h1 { color: #ef4444; font-size: 22px; }
    .btn { background: #ef4444; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; }
    footer { margin-top: 30px; font-size: 13px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Payment Overdue</h1>
    <p>Your payment for invoice <strong>#{{invoiceId}}</strong> ({{currency}} {{formattedAmount}}) is overdue.</p>
    <p>Please complete the payment immediately to avoid suspension of services.</p>
    <a href="https://launchix.ai/pay/{{invoiceId}}" class="btn">Pay Now</a>
    <footer>Have questions? Contact <a href="mailto:billing@launchix.ai">billing@launchix.ai</a></footer>
  </div>
</body>
</html>
