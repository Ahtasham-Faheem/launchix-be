<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: 'Inter', sans-serif; color: #1e293b; background: #f9fafb; padding: 40px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); padding: 32px; max-width: 600px; margin: auto; }
    h1 { color: #3b82f6; font-size: 22px; }
    .amount { font-size: 28px; color: #111827; margin: 16px 0; }
    .btn { display: inline-block; background: linear-gradient(90deg,#3b82f6,#8b5cf6); color: white; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: 600; }
    footer { margin-top: 30px; font-size: 13px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Your Invoice is Ready</h1>
    <p>Invoice ID: <strong>{{invoiceId}}</strong></p>
    <div class="amount">{{currency}} {{formattedAmount}}</div>
    <p>Please pay by <strong>{{dueDateFormatted}}</strong> to keep your subscription active.</p>
    <a href="https://launchix.ai/pay/{{invoiceId}}" class="btn">Pay Now</a>
    <footer>
      Need help? <a href="mailto:billing@launchix.ai">Contact Support</a>
    </footer>
  </div>
</body>
</html>
